[project]
name = "routewise-api"
version = "0.1.0"
description = "RouteWise API: weather-aware truck route comparison"
requires-python = ">=3.13,<3.14"
dependencies = [
  "django>=5.2.18,<6.0",
  "djangorestframework>=3.18.3",
  "drf-spectacular>=0.30.0",
  "django-cors-headers>=4.9.0",
  "django-environ>=0.14.0",
  "requests>=2.34.2",
  "tenacity>=9.2.1",
  "shapely>=2.2.0",
  "pyproj>=3.8.0",
  "numpy>=2.5.3",
  "timezonefinder>=9.0",
  "tzdata>=2026.5",  # IANA time zones for zoneinfo on any host, not just Windows
  "gunicorn>=26.2.0",
  "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-django>=4.14.0",
  "pytest-cov>=7.1.0",
  "responses>=0.26.3",
  "time-machine>=3.5.1",
  "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["trips/tests"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ"]
